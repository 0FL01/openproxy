[package]
name = "openproxy-dashboard"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
futures-util = "0.3"
gloo-net = { version = "0.7", default-features = false, features = ["eventsource", "http", "json"] }
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = "0.8.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
send_wrapper = "0.6"
urlencoding = "2"
url = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.5"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "BroadcastChannel",
    "Document",
    "DomTokenList",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "ReadableStream",
    "Storage",
    "UrlSearchParams",
    "Window",
] }
