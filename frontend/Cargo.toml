[package]
name = "openproxy-dashboard"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["lib", "launch", "router", "web"] }
futures-channel = "0.3"
futures-util = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "AddEventListenerOptions", "Blob", "BlobPropertyBag", "BroadcastChannel", "CanvasRenderingContext2d", "Clipboard", "ClipboardEvent", "Crypto", "CssStyleDeclaration", "DataTransfer", "Document", "DomRect", "DomRectList", "DomTokenList", "Element", "Event", "EventSource", "EventTarget", "File", "FileList", "FormData", "Headers", "History", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "InputEvent", "KeyboardEvent", "Location", "MediaQueryList", "MessageEvent", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "Node", "NodeList", "Range", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestCache", "RequestCredentials", "RequestInit", "ResizeObserver", "Response", "ScrollBehavior", "ScrollIntoViewOptions", "Storage", "StorageEvent", "TextDecodeOptions", "TextDecoder", "TextMetrics", "TreeWalker", "Url", "UrlSearchParams", "VisibilityState", "WheelEvent", "Window"] }
