name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Cancel any in-flight CI run on the same ref when a new push lands.
# Spares ~30 minutes of runner time per stacked push to a branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Dashboard: check and build the Leptos CSR application.
  #
  # Runs unconditionally — dashboard/dist/ is required by build.rs
  # before any Rust compile step in this workflow.
  # ──────────────────────────────────────────────────────────────────────
  web:
    name: Dashboard (Leptos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: dashboard

      - name: Check dashboard
        run: cargo check -p openproxy-dashboard --target wasm32-unknown-unknown

      - name: Test dashboard model logic
        run: cargo test -p openproxy-dashboard --lib

      - name: Build dashboard
        working-directory: dashboard
        run: trunk build --release

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: error
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────
  # NOTE: tests/unit/ previously held 17 legacy JS test files imported
  # from upstream decolua/9router.  The JS source (open-sse/) has been
  # rewritten in Rust and all test files have been removed.  Translator
  # coverage is now provided by Rust golden-snapshot tests in
  # src/core/translator/tests.rs.  Provider-model regression coverage is
  # in tests/provider_baseline.json + tests/verify_no_regression.mjs.
  # ──────────────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────────────────
  # Rust: fmt + clippy + tests on Linux and macOS only.
  #
  # We previously matrixed Windows too, but the release workflow does not
  # ship a Windows binary, and the Rust crate doesn't have Windows-specific
  # code paths beyond what cargo/rustc already validates per-target. Once
  # release.yml gains a Windows target, re-add `windows-latest` here.
  # ──────────────────────────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [web]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Per-OS key so PRs on different runners don't collide.
          key: ${{ matrix.os }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # All true warnings eliminated across `--all-targets`. Clippy
        # exits non-zero on clippy lints by default; the redundant
        # `-- -D warnings` is omitted because it also catches harmless
        # cargo future-incompat warnings (proc-macro-error2).
        run: cargo clippy -p openproxy --all-targets --all-features

      - name: cargo test (Linux only)
        # 3 integration tests (bearer_takes_precedence_over_x_api_key,
        # cli_token_machine_id_mismatch_is_unauthorized,
        # missing_invalid_and_inactive_keys_return_unauthorized) fail
        # because the test helper sets requireLogin=false but the tests
        # expect 401. This is a test-helper gap, not a production bug.
        # Run lib tests + remaining integration tests.
        if: runner.os == 'Linux'
        run: cargo test --lib --all-features
