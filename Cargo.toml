[package]
name = "openproxy"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }

# HTTP client (hot path)
hyper = { version = "1.5", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http2"] }
rustls = "0.23"

# HTTP client (complex - OAuth, proxy)
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "multipart", "gzip", "brotli", "socks", "stream", "rustls-tls"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
toml = "0.8"

# JWT auth
jsonwebtoken = "9"
bcrypt = "0.19"

# Streaming / bytes
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io", "net", "codec"] }

# Async runtime utilities
async-trait = "0.1"
dashmap = "6"
once_cell = "1"
regex = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
arc-swap = "1"

# Crypto
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
sha256 = "1.6"
# rsa 0.9 OAEP needs digest-0.10 sha2; the workspace sha2 is 0.11.
sha2_rsa_compat = { package = "sha2", version = "0.10" }

# URL / query
url = "2"
urlencoding = "2"
serde_urlencoded = "0.7"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Compression
flate2 = "1"

# CRC for AWS EventStream
crc32fast = "1.4"

# Random
rand = "0.8"

libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }

# Async stream
async-stream = "0.3"

# RSA for JWT signing
rsa = "0.9"


# AES-CBC encryption + supporting crates
aes = "0.8"
cbc = "0.1"
# AES-GCM (authenticated encryption) — new credential cipher (H20)
aes-gcm = "0.10"
# Argon2id KDF — credential key derivation (H20)
argon2 = "0.5"
time = "0.3"

# Client identity
whoami = "2"

# CLI: cross-platform user config directory resolution
directories = "5"

# Embedded web dashboard (Astro static output) + cross-platform browser-open.
# `compression` requires the rust-embed `folder` to be a relative path at the
# crate root, so we drop `interpolate-folder-path`.
rust-embed = { version = "8", features = ["compression", "mime-guess"] }
mime_guess = "2"
open = "5"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json", "yaml"] }

[[bin]]
name = "openproxy"
path = "src/main.rs"

[features]
default = ["embed-web"]
# Embed `web/dist/` into the release binary. Disable for headless / sidecar-proxy builds.
embed-web = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "s"
